<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0a0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glow">
<title>Glow Selfie</title>
<style>
  :root{--bg:#0b0a0c;--ink:#fff;--ink-dim:rgba(255,255,255,.72);--chip:rgba(16,14,18,.55);--chip-strong:rgba(16,14,18,.82);--accent:#ffc861;--light:#fff3e4;color-scheme:dark}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  button:focus-visible,.slider:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  svg{display:block}

  .app{position:fixed;inset:0;overflow:hidden;contain:strict}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  video.mirror{transform:scaleX(-1)}

  /* My edge light. It's a small gradient I draw once and let the GPU stretch, so nothing gets redrawn on every camera frame (that's what made my first version lag). */
  #glow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;will-change:opacity;transition:opacity .2s linear}
  #glow.off{opacity:0}

  .rail{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);
    display:flex;flex-direction:column;align-items:center;gap:12px}
  .tool{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--chip)}
  .tool:active{transform:scale(.9)}
  .tool svg{width:24px;height:24px}
  .tool.lit{background:var(--accent);color:#231a08}
  .tone-dot{width:22px;height:22px;border-radius:50%;background:var(--light);box-shadow:0 0 0 2px #fff}
  .timer-txt{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}

  .slider{width:46px;height:190px;border-radius:23px;margin-top:4px;background:var(--chip);
    display:flex;flex-direction:column;align-items:center;padding:12px 0 10px;gap:8px;touch-action:none}
  .slider svg{width:18px;height:18px;flex:none;color:var(--accent)}
  .track{position:relative;flex:1;width:6px;border-radius:3px;background:rgba(255,255,255,.3)}
  .fill{position:absolute;left:0;right:0;bottom:0;height:100%;border-radius:3px;background:#fff;transform-origin:bottom;will-change:transform}
  .knob{position:absolute;left:50%;bottom:0;width:22px;height:22px;margin-left:-11px;margin-bottom:-11px;border-radius:50%;background:#fff;will-change:transform}
  .val{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}

  .bottom{position:absolute;left:0;right:0;bottom:0;padding:0 28px calc(env(safe-area-inset-bottom,0px) + 28px);
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  .thumb{justify-self:start;width:50px;height:50px;border-radius:14px;overflow:hidden;background:var(--chip);border:2px solid rgba(255,255,255,.9)}
  .thumb.empty{visibility:hidden}
  .thumb canvas{width:100%;height:100%;display:block;object-fit:cover}
  .shutter{width:84px;height:84px;border-radius:50%;border:6px solid #fff;background:rgba(255,255,255,.12);transition:transform .1s ease}
  .shutter:active,.shutter.snap{transform:scale(.86)}

  .count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
    font-size:min(40vw,220px);font-weight:800;text-shadow:0 2px 16px rgba(0,0,0,.5)}

  .toast{position:absolute;z-index:20;left:50%;top:calc(env(safe-area-inset-top,0px) + 22px);
    transform:translateX(-50%);max-width:calc(100% - 140px);background:var(--chip-strong);
    padding:9px 14px;border-radius:14px;font-size:14px;font-weight:600;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .2s linear}
  .toast.show{opacity:1}

  .preview{position:absolute;inset:0;z-index:15;background:#000}
  .preview canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .pbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:12px;justify-content:center;
    padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 20px)}
  .pill{display:inline-flex;align-items:center;gap:8px;height:50px;padding:0 24px;border-radius:25px;
    font-weight:700;font-size:16px;background:var(--chip-strong)}
  .pill svg{width:20px;height:20px}
  .pill.primary{background:var(--accent);color:#231a08}
  .pill:active{transform:scale(.96)}

  .panel{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:center;
    padding:32px 24px;gap:14px;background:var(--bg)}
  .panel h1{margin:0;font-size:30px;font-weight:800;text-wrap:balance}
  .panel p{margin:0;color:var(--ink-dim);font-size:16px;line-height:1.5;max-width:34ch}
  .panel .pill{align-self:flex-start;margin-top:8px}
  .glowmark{width:84px;height:84px;border-radius:26px;margin-bottom:10px;background:#000;box-shadow:inset 0 0 22px 8px #fff3e4}

  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <video id="cam" class="mirror" autoplay playsinline muted disablepictureinpicture></video>
  <canvas id="glow"></canvas>

  <div class="rail">
    <button class="tool" id="flipBtn" aria-label="Switch camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/></svg>
    </button>
    <button class="tool lit" id="lightBtn" aria-label="Edge light on" aria-pressed="true">
      <svg id="boltOn" viewBox="0 0 24 24" fill="currentColor"><path d="M13.2 2 4.5 13.4h6.3L9.9 22l8.6-11.6h-6.2z"/></svg>
      <svg id="boltOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M13 2 7.8 9M12.6 13.4H4.5l2.3-3M16 12.4 9.9 22l.9-8.6M3 3l18 18"/></svg>
    </button>
    <button class="tool" id="toneBtn" aria-label="Light colour"><span class="tone-dot"></span></button>
    <button class="tool" id="timerBtn" aria-label="Self timer off">
      <svg id="timerIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>
      <span class="timer-txt" id="timerTxt" hidden></span>
    </button>
    <div class="slider" id="slider" role="slider" tabindex="0" aria-label="Light brightness" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="75">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <div class="track" id="track"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
      <span class="val" id="val">75</span>
    </div>
  </div>

  <div class="bottom">
    <button class="thumb empty" id="thumb" aria-label="Open last photo"><canvas id="thumbCv"></canvas></button>
    <button class="shutter" id="shutter" aria-label="Take photo"></button>
    <span></span>
  </div>

  <div class="count" id="count" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="preview" id="preview" hidden>
    <canvas id="shot" aria-label="Your selfie" role="img"></canvas>
    <div class="pbar">
      <button class="pill" id="retake"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>Retake</button>
      <button class="pill primary" id="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Save</button>
    </div>
  </div>

  <div class="panel" id="panel" hidden>
    <div class="glowmark"></div>
    <h1 id="panelTitle">Turn on your camera</h1>
    <p id="panelMsg">Glow Selfie uses your front camera and lights up the edges of your screen so your face stays lit in the dark.</p>
    <button class="pill primary" id="retry">Allow camera</button>
  </div>
</div>

<script>
// Glow Selfie by Jackuson
// I wanted a Snapchat-style front light for taking selfies in the dark, so I made my own.
(() => {
  const $ = s => document.getElementById(s);
  const video = $('cam'), glow = $('glow'), gctx = glow.getContext('2d');

  const TONES = [
    { name: 'Warm light', rgb: [255, 210, 154] },
    { name: 'Soft white', rgb: [255, 243, 228] },
    { name: 'Cool light', rgb: [226, 237, 255] },
    { name: 'Pink glow',  rgb: [255, 214, 230] },
  ];
  const TIMERS = [0, 3, 10];
  const S = { on: true, level: 0.75, tone: 1, timer: 0, facing: 'user', stream: null, busy: false, shot: null };

  try {
    const p = JSON.parse(localStorage.getItem('glowselfie2') || '{}');
    ['on', 'level', 'tone', 'timer'].forEach(k => { if (p[k] != null) S[k] = p[k]; });
  } catch (e) {}
  const persist = () => { try { localStorage.setItem('glowselfie2', JSON.stringify({ on: S.on, level: S.level, tone: S.tone, timer: S.timer })); } catch (e) {} };

  let toastT;
  function toast(msg, ms = 1500) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
  }

  /* ---------- Edge light ----------
     I render this at 1/4 of the screen resolution and let the GPU stretch it.
     The gradient is so smooth that you can't tell, and I only redraw it when
     I change the brightness or colour, or turn the phone. */
  const SCALE = 0.25;
  let img = null, gw = 0, gh = 0;
  function drawGlow() {
    const w = Math.max(2, Math.round(innerWidth * SCALE));
    const h = Math.max(2, Math.round(innerHeight * SCALE));
    if (w !== gw || h !== gh) { gw = glow.width = w; gh = glow.height = h; img = gctx.createImageData(w, h); }
    const d = img.data, [r, g, b] = TONES[S.tone].rgb;
    const l = S.level, m = Math.min(w, h);
    const reach = m * (0.10 + 0.42 * l);     // how far I want the light to reach in from the edges
    const solid = reach * (0.18 + 0.22 * l); // the fully bright strip right at the edge
    const fade = reach - solid;
    const peak = 255 * (0.55 + 0.45 * l);
    // how bright the light is at a given distance from one edge
    const fall = dist => {
      if (dist <= solid) return 1;
      if (dist >= reach) return 0;
      const t = 1 - (dist - solid) / fade; return t * t * (3 - 2 * t);
    };
    // I work out the rows and columns once first so the pixel loop stays cheap
    const colK = new Float32Array(w), rowK = new Float32Array(h);
    for (let x = 0; x < w; x++) colK[x] = (1 - fall(x + 0.5)) * (1 - fall(w - x - 0.5));
    for (let y = 0; y < h; y++) rowK[y] = (1 - fall(y + 0.5)) * (1 - fall(h - y - 0.5));
    // I blend all four edges like overlapping lamps. That got rid of the ugly diagonal seams I had in the corners.
    let i = 0;
    for (let y = 0; y < h; y++) {
      const rk = rowK[y];
      for (let x = 0; x < w; x++, i += 4) {
        d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = (1 - rk * colK[x]) * peak;
      }
    }
    gctx.putImageData(img, 0, 0);
  }
  let glowQueued = false;
  const queueGlow = () => { if (!glowQueued) { glowQueued = true; requestAnimationFrame(() => { glowQueued = false; drawGlow(); }); } };

  function renderUI() {
    $('lightBtn').classList.toggle('lit', S.on);
    $('lightBtn').setAttribute('aria-pressed', S.on);
    $('lightBtn').setAttribute('aria-label', S.on ? 'Edge light on' : 'Edge light off');
    $('boltOn').hidden = !S.on; $('boltOff').hidden = S.on;
    $('slider').hidden = !S.on; $('toneBtn').hidden = !S.on;
    glow.classList.toggle('off', !S.on);
    document.documentElement.style.setProperty('--light', 'rgb(' + TONES[S.tone].rgb + ')');
    $('toneBtn').setAttribute('aria-label', 'Light colour: ' + TONES[S.tone].name);
    $('timerIcon').hidden = S.timer !== 0; $('timerTxt').hidden = S.timer === 0;
    $('timerTxt').textContent = S.timer + 's';
    $('timerBtn').classList.toggle('lit', S.timer !== 0);
    $('timerBtn').setAttribute('aria-label', S.timer ? 'Self timer ' + S.timer + ' seconds' : 'Self timer off');
    video.classList.toggle('mirror', S.facing === 'user');
    renderSlider();
  }

  /* ---------- Brightness slider ----------
     I only move things with transforms here so dragging stays smooth. */
  const slider = $('slider'), track = $('track');
  let trackH = 0, trackTop = 0;
  function renderSlider() {
    const pct = Math.round(S.level * 100);
    trackH = track.clientHeight || trackH;
    $('fill').style.transform = 'scaleY(' + S.level + ')';
    $('knob').style.transform = 'translateY(' + (-S.level * trackH) + 'px)';
    $('val').textContent = pct;
    slider.setAttribute('aria-valuenow', pct);
  }
  function setLevel(v) { S.level = Math.min(1, Math.max(0, v)); renderSlider(); queueGlow(); }
  slider.addEventListener('pointerdown', e => {
    slider.setPointerCapture(e.pointerId);
    const r = track.getBoundingClientRect(); trackTop = r.top; trackH = r.height;
    setLevel(1 - (e.clientY - trackTop) / trackH);
  });
  slider.addEventListener('pointermove', e => {
    if (slider.hasPointerCapture(e.pointerId)) setLevel(1 - (e.clientY - trackTop) / trackH);
  });
  slider.addEventListener('pointerup', persist);
  slider.addEventListener('pointercancel', persist);
  slider.addEventListener('keydown', e => {
    const step = { ArrowUp: .05, ArrowRight: .05, ArrowDown: -.05, ArrowLeft: -.05, PageUp: .2, PageDown: -.2 }[e.key];
    if (step == null) return;
    e.preventDefault(); setLevel(S.level + step); persist();
  });

  /* ---------- Buttons ---------- */
  $('lightBtn').addEventListener('click', () => { S.on = !S.on; renderUI(); persist(); toast(S.on ? 'Edge light on' : 'Edge light off'); });
  $('toneBtn').addEventListener('click', () => { S.tone = (S.tone + 1) % TONES.length; renderUI(); queueGlow(); persist(); toast(TONES[S.tone].name); });
  $('timerBtn').addEventListener('click', () => {
    S.timer = TIMERS[(TIMERS.indexOf(S.timer) + 1) % TIMERS.length];
    renderUI(); persist(); toast(S.timer ? S.timer + ' second timer' : 'Timer off');
  });
  $('flipBtn').addEventListener('click', flip);
  let lastTap = 0;
  video.addEventListener('pointerup', () => { const n = Date.now(); if (n - lastTap < 300) { flip(); lastTap = 0; } else lastTap = n; });
  function flip() { S.facing = S.facing === 'user' ? 'environment' : 'user'; startCamera(); }

  /* ---------- Camera ---------- */
  async function startCamera() {
    const panel = $('panel');
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      $('panelTitle').textContent = 'Open this from a web link';
      $('panelMsg').textContent = 'Browsers don’t let a file opened from Downloads use the camera. Open the https link instead, then add it to your home screen.';
      $('retry').hidden = true; panel.hidden = false; return;
    }
    if (S.stream) S.stream.getTracks().forEach(t => t.stop());
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: S.facing }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30, max: 30 } }
      });
      S.stream = stream; video.srcObject = stream;
      await video.play().catch(() => {});
      panel.hidden = true; renderUI(); keepAwake();
    } catch (err) {
      const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      $('panelTitle').textContent = denied ? 'Camera access is blocked' : 'Couldn’t start the camera';
      $('panelMsg').textContent = denied
        ? 'Tap the icon left of the address bar, allow Camera, then tap Try again.'
        : 'Another app might be using the camera. Close it and tap Try again.';
      $('retry').textContent = 'Try again'; $('retry').hidden = false; panel.hidden = false;
    }
  }
  $('retry').addEventListener('click', startCamera);

  let wakeLock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      // I let go of the camera when the app's in the background so it doesn't drain my battery
      if (S.stream) { S.stream.getTracks().forEach(t => t.stop()); S.stream = null; }
    } else { startCamera(); }
  });

  /* ---------- Taking the photo ----------
     I never touch the light when I shoot, so the photo is lit exactly how it looks on screen.
     I try three ways to get the sharpest photo, best first:
       1. Android Chrome: a real full-resolution photo from the camera (ImageCapture)
       2. iPhone Safari: I bump the camera up to its highest resolution for a split second and grab that frame
       3. Anything else: a frame from the normal 1080p preview */
  const shot = $('shot'), sctx = shot.getContext('2d');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const timeout = (p, ms) => Promise.race([p, sleep(ms).then(() => { throw new Error('timeout'); })]);
  const isPortrait = (w, h) => h >= w;
  const videoTrack = () => S.stream && S.stream.getVideoTracks()[0];

  // I crop whatever I got to the shape of my screen, mirror it for selfies, and draw it into the preview
  function drawShot(src, w, h) {
    const sw = innerWidth, sh = innerHeight;
    const k = Math.max(sw / w, sh / h);
    const cw = Math.round(sw / k), ch = Math.round(sh / k);
    const sx = (w - cw) >> 1, sy = (h - ch) >> 1;
    shot.width = cw; shot.height = ch;
    sctx.setTransform(1, 0, 0, 1, 0, 0);
    if (S.facing === 'user') sctx.setTransform(-1, 0, 0, 1, cw, 0);
    sctx.drawImage(src, sx, sy, cw, ch, 0, 0, cw, ch);
    sctx.setTransform(1, 0, 0, 1, 0, 0);
    // I keep a tiny copy for the thumbnail button
    const t = $('thumbCv'); t.width = 100; t.height = Math.round(100 * ch / cw);
    t.getContext('2d').drawImage(shot, 0, 0, t.width, t.height);
    $('thumb').classList.remove('empty');
  }

  // 1. Android: ask the camera for a proper still photo at its max resolution
  let imageCapture = null, imageCaptureTrack = null;
  async function fullResPhoto(track) {
    if (!('ImageCapture' in window)) return false;
    if (imageCaptureTrack !== track) { imageCapture = new ImageCapture(track); imageCaptureTrack = track; }
    const caps = await timeout(imageCapture.getPhotoCapabilities(), 1500);
    const settings = {};
    if (caps.imageWidth && caps.imageWidth.max) settings.imageWidth = caps.imageWidth.max;
    if (caps.imageHeight && caps.imageHeight.max) settings.imageHeight = caps.imageHeight.max;
    if (caps.fillLightMode && caps.fillLightMode.includes('off')) settings.fillLightMode = 'off'; // no flash, ever
    const blob = await timeout(imageCapture.takePhoto(settings), 4000);
    const bmp = await createImageBitmap(blob, { imageOrientation: 'from-image' });
    // if the photo comes back rotated differently to the preview, I don't trust it and fall back
    if (isPortrait(bmp.width, bmp.height) !== isPortrait(video.videoWidth, video.videoHeight)) { bmp.close(); return false; }
    drawShot(bmp, bmp.width, bmp.height);
    bmp.close();
    return true;
  }

  // 2. iPhone: Safari has no ImageCapture, so I switch the stream to max resolution just for the shot
  const nextVideoFrame = () => new Promise(r => {
    if (video.requestVideoFrameCallback) { video.requestVideoFrameCallback(() => r()); setTimeout(r, 300); }
    else setTimeout(r, 120);
  });
  async function hiResFrame(track) {
    if (!track.getCapabilities) return false;
    const caps = track.getCapabilities(), cur = track.getSettings();
    if (!caps.width || !caps.height || !caps.width.max || !caps.height.max) return false;
    const big = Math.max(caps.width.max, caps.height.max), small = Math.min(caps.width.max, caps.height.max);
    if (big <= Math.max(cur.width || 0, cur.height || 0)) return false; // already at max
    const before = video.videoWidth * video.videoHeight;
    let ok = false;
    try {
      await timeout(track.applyConstraints({ width: { ideal: big }, height: { ideal: small } }), 2000);
      // I wait until the bigger frames are actually showing up
      const t0 = performance.now();
      while (video.videoWidth * video.videoHeight <= before && performance.now() - t0 < 1500) await sleep(40);
      if (video.videoWidth * video.videoHeight > before) {
        await nextVideoFrame();
        drawShot(video, video.videoWidth, video.videoHeight);
        ok = true;
      }
    } catch (e) {}
    // back to the lighter 1080p preview so it doesn't lag
    track.applyConstraints({ width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30, max: 30 } }).catch(() => {});
    return ok;
  }

  async function capture() {
    const track = videoTrack();
    if (track) {
      try { if (await fullResPhoto(track)) return 'photo'; } catch (e) {}
      try { if (await hiResFrame(track)) return 'hires'; } catch (e) {}
    }
    drawShot(video, video.videoWidth, video.videoHeight); // 3. plain preview frame
    return 'preview';
  }

  async function shoot() {
    if (S.busy || !video.videoWidth) return;
    S.busy = true;
    if (S.timer) {
      const c = $('count'); c.hidden = false;
      for (let i = S.timer; i > 0; i--) { c.textContent = i; await sleep(1000); }
      c.hidden = true;
    }
    const sh = $('shutter'); sh.classList.add('snap'); setTimeout(() => sh.classList.remove('snap'), 120);
    await capture();
    S.shot = null; // I only turn it into a JPEG when I hit Save
    $('preview').hidden = false;
    S.busy = false;
  }
  $('shutter').addEventListener('click', shoot);
  document.addEventListener('keydown', e => {
    if ((e.key === ' ' || e.key === 'Enter') && $('preview').hidden && document.activeElement === document.body) { e.preventDefault(); shoot(); }
    if (e.key === 'Escape') $('preview').hidden = true;
  });
  $('thumb').addEventListener('click', () => { if (shot.width) $('preview').hidden = false; });
  $('retake').addEventListener('click', () => { $('preview').hidden = true; });

  $('save').addEventListener('click', async () => {
    if (!shot.width) return;
    if (!S.shot) S.shot = await new Promise(r => shot.toBlob(r, 'image/jpeg', 0.93));
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const name = `glow-selfie-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`;
    const file = new File([S.shot], name, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(S.shot), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Saved to your downloads');
  });

  addEventListener('resize', () => { queueGlow(); renderSlider(); });

  renderUI(); drawGlow();
  startCamera().then(() => { if ($('panel').hidden) setTimeout(() => toast('Tip: set screen brightness to max', 2400), 500); });
})();
</script>
</body>
</html>
